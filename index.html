:root{
  --ink:#3B2A1A; --ink2:#6E5A40; --cream:#FFF4D6; --line:#EBD7A8;
  --orange:#FF8A3D; --orange-d:#C2560F; --green:#3DB83A; --green-d:#26812A;
  --red:#E8475C; --red-d:#B42D3F; --blue:#2E9BE6; --yellow:#FFC21A; --sea:#7FD3FF; --grass:#9BE07A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#E9F7FF;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;position:relative;background:var(--cream);overflow-x:hidden;box-shadow:0 0 40px rgba(0,60,100,.12)}
.screen{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(78px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
.screen.nonav{padding-bottom:0}
.grow{flex:1 1 auto;min-height:0}
.bg-sea{background:var(--sea)} .bg-grass{background:var(--grass)} .bg-yellow{background:#FFD66B}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;flex-shrink:0}
.pill{background:#fff;border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--sh,#EBD7A8)}
.icon-btn{width:46px;height:46px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--sh,#EBD7A8);flex-shrink:0}
.icon-btn:active,.btn:active,.opt:active{transform:translateY(3px);box-shadow:none}
.titlebox{flex:1;background:#fff;border-radius:18px;padding:4px 14px;box-shadow:0 3px 0 var(--sh,#EBD7A8);min-width:0}
.titlebox b{display:block;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox small{display:block;font-size:13px;font-weight:700;color:var(--ink2);line-height:1.2}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:clamp(48px,6.6dvh,58px);min-height:clamp(48px,6.6dvh,58px);min-width:0;border-radius:20px;font-size:21px;font-weight:800;width:100%;text-decoration:none}
.btn-green{background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d);text-shadow:0 1px 0 #1E6A21}
.btn-orange{background:var(--orange);color:#3B1A05;box-shadow:0 6px 0 var(--orange-d)}
.btn-white{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn-gray{background:#EFE7D6;color:#5E5140;font-size:17px;cursor:default}
.card{background:#fff;border-radius:26px;padding:14px;flex-shrink:0;box-shadow:0 6px 0 var(--sh,#EBD7A8)}
.nav{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:26px 26px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -4px 18px rgba(80,60,20,.12);z-index:50}
.nav button{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:13px;color:#6E5A40;padding:4px;min-height:52px;border-radius:14px;line-height:1.2}
.nav button.on{color:var(--orange-d);font-weight:800;background:#FFF4D6}
/* map */
.map{position:relative;container-type:size;flex:1 1 auto;min-height:220px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.island{position:absolute;width:44%;text-align:center;transition:transform .2s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.island.sel{transform:scale(1.07)}
.land{position:relative;width:100%;height:clamp(40px,calc(100cqh / var(--n) - 40px),84px);border-radius:48% 52% 44% 56%/58% 50% 50% 42%;display:flex;align-items:center;justify-content:center}
.land .sym{min-width:min(48px,calc(100% - 10px));height:min(48px,80%);aspect-ratio:1;padding:0 6px;border-radius:999px;background:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tag{margin:11px auto 0;display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:800;white-space:nowrap}
.tag small{font-size:12px;color:#6E5A40}
.stars{display:flex;gap:2px;justify-content:center;margin-top:2px;min-height:16px}
.lock{position:absolute;right:10px;top:8px}
.mascot-on{position:absolute;pointer-events:none;z-index:3;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.stone{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.stone .s{width:clamp(40px,10.5cqh,62px);height:clamp(40px,10.5cqh,62px);border-radius:999px;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stone.chest .s{width:clamp(50px,13cqh,76px);height:clamp(50px,13cqh,76px)}
.stone .stars{margin-top:1px;min-height:0}
.stone.now .s{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--cream);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
/* question */
.q-head{background:var(--grass);padding:calc(12px + env(safe-area-inset-top)) 14px 8px;border-radius:0 0 26px 26px;flex-shrink:0}
.track{position:relative;height:50px;margin-top:4px}
.track .bar{position:absolute;left:10px;right:22px;top:32px;height:8px;background:#F5D58A;border-radius:999px}
.track .dots{position:absolute;left:0;right:12px;top:26px;display:flex;justify-content:space-between}
.track .dot{width:20px;height:20px;border-radius:999px;border:3px solid #E0C98F;background:var(--cream)}
.track .dot.done{border-color:#C98A00;background:var(--yellow)}
.track .walker{position:absolute;top:0;transition:left .6s cubic-bezier(.3,1.4,.6,1)}
.qcard{margin:12px 14px 0;background:#fff;border-radius:26px;padding:12px 14px;flex:1 1 auto;min-height:0;justify-content:center;overflow:auto;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qtext{font-size:18px;font-weight:700;color:var(--ink);line-height:1.3}
.expr{font-size:clamp(34px,5.6dvh,48px);font-weight:800;line-height:1.05;letter-spacing:1px;word-break:break-word}
.expr .blank{display:inline-block;min-width:62px;border-bottom:5px dashed var(--orange);color:var(--orange-d);text-align:center}
.expr.small{font-size:clamp(28px,4.4dvh,38px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px 0;flex-shrink:0}
.opt{height:clamp(56px,8.6dvh,80px);border-radius:22px;font-size:clamp(28px,4.4dvh,36px);font-weight:800;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);color:var(--ink)}
.opt.ok{background:#C9F2C7;border-color:var(--green-d);box-shadow:0 6px 0 var(--green-d);color:#133D12;animation:pop .35s}
.opt.bad{background:#FFD0D6;border-color:var(--red-d);box-shadow:0 6px 0 var(--red-d);color:#4A1019;animation:shake .4s}
.opt.dim{opacity:.45}
.opt.sel{background:#FFE7CF;border-color:var(--orange-d);box-shadow:0 6px 0 var(--orange-d);color:#3B1A05;transform:translateY(-3px)}
.btn[disabled]{background:#EFE7D6;color:#5E5140;box-shadow:none;text-shadow:none;cursor:default;font-size:18px}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{margin:10px 14px 0;border-radius:18px;padding:8px 12px;font-size:16px;line-height:1.25;flex-shrink:0;font-weight:700;display:flex;gap:10px;align-items:center}
.feedback.ok{background:#C9F2C7;color:#133D12}
.feedback.bad{background:#FFE3E7;color:#4A1019}
.feedback.tip{background:#FFF0C2;color:#5C4000}
.vis{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.vis .grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:150px}
.vis .op{font-size:34px;font-weight:800;padding:0 4px}
.obj{width:clamp(22px,3.3dvh,28px);height:clamp(22px,3.3dvh,28px);position:relative;display:inline-block}
.obj svg{width:100%;height:100%}
.obj.gone{opacity:.3}
.obj.gone::after{content:"";position:absolute;left:-2px;right:-2px;top:12px;height:4px;background:var(--red-d);transform:rotate(-40deg);border-radius:2px}
.obj .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;padding-top:3px}
.arr{display:grid;gap:5px}
.arr i{width:20px;height:20px;border-radius:999px;background:var(--blue);display:block}
.arr i.off{background:#E3DCC9}
.plates{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.plate{min-width:64px;min-height:56px;border-radius:999px;border:3px solid var(--line);background:var(--cream);padding:8px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;max-width:96px}
.plate i{width:14px;height:14px;border-radius:999px;background:var(--orange);display:block}
.blocks{display:flex;gap:12px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.blk-h{width:44px;height:44px;background:#E8475C;border-radius:4px;background-image:linear-gradient(#fff3 1px,transparent 1px),linear-gradient(90deg,#fff3 1px,transparent 1px);background-size:4.4px 4.4px}
.blk-t{width:9px;height:44px;background:var(--blue);border-radius:3px;background-image:linear-gradient(#fff5 1px,transparent 1px);background-size:9px 4.4px}
.blk-o{width:9px;height:9px;background:var(--green);border-radius:2px}
.bgroup{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;max-width:150px}
.bcap{font-size:13px;font-weight:700;color:var(--ink2);text-align:center;margin-top:4px}
/* misc */
.hearts{display:flex;gap:2px}
.center{text-align:center}
.h1{font-size:40px;font-weight:800;line-height:1.05}
.muted{color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:12px;padding:8px 16px}
.row-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;text-align:left;width:100%}
.badge{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex-shrink:0}
.grid-stk{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:6px 14px 10px;align-content:start;flex:1 1 auto;min-height:0;overflow-y:auto}
.stk{aspect-ratio:1;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.6dvh,30px);box-shadow:0 4px 0 var(--line)}
.stk.locked{background:#F1E9D6;box-shadow:none;color:#B9AC94}
.stk.new{animation:pop .6s 3}
input.txt{width:100%;height:50px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:22px;font-weight:700;padding:0 16px;outline:none}
input.txt:focus{border-color:var(--orange)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{height:50px;border-radius:18px;font-size:19px;font-weight:800;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.seg button.on{background:var(--orange);border-color:var(--orange-d);box-shadow:0 4px 0 var(--orange-d);color:#3B1A05}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;line-height:1.2;background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:700;width:100%;text-align:left}
.sw{width:56px;height:32px;border-radius:999px;background:#D9CDB3;position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:999px;background:#fff;transition:left .2s}
.sw.on{background:var(--green)} .sw.on::after{left:28px}
.race{margin:12px 16px 0;background:#4FB8F0;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lane{position:relative;height:44px;background:#7FD3FF;border-radius:999px}
.lane .boat{position:absolute;top:2px;transition:left .5s}
.lane .flag{position:absolute;right:8px;top:6px}
.lane .who{position:absolute;right:40px;top:10px;font-size:13px;font-weight:800;color:#0B3B5A;opacity:.7}
.timer{font-variant-numeric:tabular-nums}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,5,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:28px;padding:22px;max-width:360px;width:100%;text-align:center}
.lesson-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.lesson-tabs button{flex-shrink:0;height:46px;padding:0 16px;border-radius:999px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:16px}
.lesson-tabs button.on{background:var(--blue);border-color:#1C6FA8;color:#fff}
.steps{display:flex;gap:6px;justify-content:center;margin-top:8px}
.steps i{height:10px;width:10px;border-radius:999px;background:var(--line);display:block;transition:width .2s}
.steps i.on{width:26px;background:var(--orange)} .steps i.done{background:var(--orange)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- v3 additions ---- */
.bg-sea2{background:#8FD9E8}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:2px 14px 0;background:rgba(255,255,255,.45);border-radius:16px;padding:4px;flex-shrink:0}
.regions button{height:38px;border-radius:12px;font-weight:800;font-size:15px;color:#0B3B5A}
.regions button.on{background:#fff;box-shadow:0 2px 0 #5BB8E6;color:#C2560F}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#F1E5C4;border-radius:16px;padding:4px}
.seg2 button{height:42px;border-radius:12px;font-weight:800;font-size:16px}
.seg2 button.on{background:#fff;box-shadow:0 2px 0 #EBD7A8;color:#C2560F}
.k-jump{animation:kjump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes kjump{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.k-sad{animation:ksad .8s}
@keyframes ksad{25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
.k-dance{animation:kdance 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes kdance{25%{transform:rotate(-8deg) translateY(-4px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(8deg) translateY(-4px)}}
.walker.hop svg{animation:kjump .6s}
.feedback svg.k-jump,.feedback svg.k-sad{flex-shrink:0}
.feedback i{font-style:normal;display:block;font-size:14px;opacity:.85}
.star-pop{display:inline-block;animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.chest-btn{position:relative;display:flex;align-items:center;justify-content:center;animation:wiggle 1.2s ease-in-out infinite}
.chest-btn svg{max-height:min(130px,16dvh);width:auto}
.chest-btn.open{animation:none}
.chest-btn.open .lid{transform-origin:20px 64px;animation:lidopen .6s forwards}
@keyframes lidopen{to{transform:rotate(-28deg) translate(-6px,-14px)}}
.chest-btn .sparkle{animation:pop .6s}
.chest-prize{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:48px;animation:rise .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{transform:translate(-50%,40px) scale(.2);opacity:0}to{transform:translate(-50%,-6px) scale(1);opacity:1}}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
.retry-chip{display:inline-flex;align-items:center;gap:6px;background:#FFF0C2;color:#5C4000;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800}
.hint-btn{position:relative}
.hint-btn .hint-n{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:999px;background:var(--orange);color:#3B1A05;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.icon-btn[disabled]{opacity:.45;cursor:default}
.opts.two{grid-template-columns:1fr 1fr}
.money{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:300px}
.coin{width:46px;height:46px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#F4F4F4,#B9BDC4);border:3px solid #8E949C;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#3B3F45}
.coin.gold{background:radial-gradient(circle at 35% 30%,#FFE9A8,#E0B23A);border-color:#B5861A;color:#5A4100}
.note{width:86px;height:44px;border-radius:6px;border:2px solid rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.note b{font-size:16px;font-weight:800;color:#2A2A2A}
.note small{font-size:8px;font-weight:800;letter-spacing:1px;color:#2A2A2A;opacity:.7;margin-top:2px}
.arr-sum{display:flex;flex-direction:column;gap:5px;margin-left:8px}
.arr-sum span{height:20px;font-size:13px;font-weight:800;color:#1D5F9E;display:flex;align-items:center}
.vis .arr+.arr-sum{align-self:flex-start}
.closet-top{display:flex;align-items:center;gap:14px;margin:0 14px;background:#fff;border-radius:24px;padding:10px 14px;box-shadow:0 4px 0 var(--line);flex-shrink:0}
.shop{padding:6px 14px 10px;overflow-y:auto;flex:1 1 auto;min-height:0}
.shop-h{font-weight:800;font-size:16px;margin:8px 0 6px}
.shop-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.shop-item{flex-shrink:0;width:84px;background:#fff;border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;box-shadow:0 3px 0 var(--line)}
.shop-item.on{border-color:var(--orange)}
.shop-item .nm{font-size:12px;font-weight:800;line-height:1.1;text-align:center;min-height:26px;display:flex;align-items:center}
.shop-item .pr{font-size:12px;font-weight:800;color:#6E5A40;display:flex;align-items:center;gap:2px}
.rep-row{display:flex;flex-direction:column;gap:3px}
.rep-lab{font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;flex-shrink:0;align-self:center}
.rep-lab.good{background:#C9F2C7;color:#133D12}.rep-lab.bad{background:#FFD0D6;color:#4A1019}.rep-lab.mid{background:#FFF0C2;color:#5C4000}.rep-lab.na{background:#EEE;color:#555}
.rep-bar{height:10px;background:#EEE7D6;border-radius:999px;overflow:hidden}
.rep-bar div{height:100%;border-radius:999px;background:#B9AC94}
.rep-bar div.good{background:var(--green)}.rep-bar div.bad{background:var(--red)}.rep-bar div.mid{background:var(--yellow)}
.mist{padding:8px 0;border-top:1px solid #EEE7D6}
.mist:first-of-type{border-top:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#3B2A1A;color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:300;max-width:90vw;text-align:center;animation:pop .3s;transition:opacity .4s}
.toast.out{opacity:0}
textarea.txt.code{height:96px;font-size:13px;font-family:ui-monospace,monospace;padding:10px;resize:none;word-break:break-all}
.modal{max-height:90dvh;overflow-y:auto}
/* ---- v4: drag & drop, boss, missions, album, certificates ---- */
[data-drag]{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.ghost{box-shadow:0 10px 24px rgba(60,40,10,.3)!important;opacity:.95;transition:none}
.locked{pointer-events:none}
.wallet{width:100%;max-width:330px;min-height:min(150px,18dvh);border:4px dashed #C98A00;background:#FFF6DC;border-radius:24px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;transition:background .15s,transform .15s}
.wallet.over{background:#FFE7A3;transform:scale(1.03);border-style:solid}
.wallet-lbl{font-size:14px;font-weight:800;color:#6B4A00;text-align:left}
.wallet-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;flex:1}
.wallet-in .coin,.wallet-in .note{cursor:pointer}

function opts4(ans,spread){
  const s=new Set([ans]); const sp=spread||Math.max(2,Math.round(ans*0.15)); const floor=ans>=3?1:0;
  const cands=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+sp,ans-sp,ans+5,ans-5];
  for(const c of shuffle(cands)){ if(s.size>=4) break; if(c>=floor&&c!==ans) s.add(c); }
  let k=3; while(s.size<4){ s.add(ans+k); k++; }
  return shuffle([...s]);
}
function optsStep(ans,step){const s=new Set([ans]);const c=shuffle([ans+step,ans-step,ans+2*step,ans-2*step,ans+3*step,ans+10*step,ans-10*step]);for(const x of c){if(s.size>=4)break;if(x>0)s.add(x);}let k=4;while(s.size<4){s.add(ans+k*step);k++;}return shuffle([...s]);}
function fill4(ans,cands){const s=new Set([ans]);for(const c of cands){if(s.size>=4)break;if(Number.isInteger(c)&&c>=0)s.add(c);}for(const c of opts4(ans)){if(s.size>=4)break;s.add(c);}return shuffle([...s]);}
function mk(o){ // {text, expr, ans, opts, vis, speak, explain, unit, step, fixed, h1, h2}

function clockOpts(h,m){const h1=h%12+1,h0=h===1?12:h-1;const c=[tStr(h,(m+30)%60),tStr(h1,m),tStr(h0,m),tStr(h,(m+15)%60),tStr(h,(m+5)%60)];

  const s=new Set([tStr(h,m)]); for(const x of c){ if(s.size>=4) break; s.add(x);} return [...s];}

function regionIslands(k,reg){if(k===0) return KELAS[0].islands; return (reg||S.region)==='pintar'?REGION2:KELAS[k].islands;}
function allIslands(k){return k===0?KELAS[0].islands.slice():KELAS[k].islands.concat(REGION2);}
function islandUnlocked(k,i,reg){ if(D.openAll||i===0) return true; const prev=regionIslands(k,reg)[i-1]; return prog(k,prev)[7]>0; }
function levelUnlocked(k,isl,lv){ if(D.openAll||lv===1) return true; return prog(k,isl)[lv-2]>0; }
function currentLevel(k,isl){const p=prog(k,isl);const i=p.findIndex(x=>x===0);return i<0?8:i+1;}
function starsK(k){let s=0;allIslands(k).forEach(id=>prog(k,id).forEach(x=>s+=x));return s;}
function starsAll(){return [0,1,2,3].reduce((a,k)=>a+starsK(k),0);}
function coins(){return Math.max(0,starsAll()+(D.bonus||0)-(D.spent||0));}
function currentIsland(k,reg){const ids=regionIslands(k,reg);for(let i=ids.length-1;i>=0;i--){if(islandUnlocked(k,i,reg)&&!D.openAll)return i;}
  for(let i=0;i<ids.length;i++){if(prog(k,ids[i]).some(x=>x===0))return i;}return ids.length-1;}
function streakNow(){const s=D.streak; return (s.last===today()||s.last===yesterday())?s.n:0;}
function dailyCount(){return D.daily.date===today()?D.daily.count:0;}
const DAILY_GOAL=5;
function bumpDaily(){ const t=today(); if(D.daily.date!==t) D.daily={date:t,count:0,done:false};
  D.daily.count++;
  if(!D.daily.done&&D.daily.count>=DAILY_GOAL){ D.daily.done=true; const s=D.streak; s.n=(s.last===yesterday())?s.n+1:(s.last===t?s.n:1); s.last=t;
    let st=null; if(s.n%3===0){ st=freeSticker(); if(st!=null) D.stickers.push(st); } D.bonus=(D.bonus||0)+2;
    S.dailyMsg={n:s.n,sticker:st}; missionEvent('daily'); }
  save(); }

function initWork(q){ if(q.kind==='trace') return {strokes:[],cov:0,out:0}; if(q.kind==='money') return {items:[]}; if(q.kind==='clock') return {h:12,m:0}; if(q.kind==='order') return {placed:Array(q.nums.length).fill(null)}; return null; }

function workDisp(q,w){ if(q.kind==='trace') return String(q.digit); if(q.kind==='money') return rp(workSum(w)); if(q.kind==='clock') return tStr(w.h,w.m); if(q.kind==='order') return w.placed.map(i=>i==null?'_':fmt(q.nums[i])).join(', '); return ''; }

function weekKey(){const d=new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y0)/864e5+1)/7);}
function hashStr(x){let h=7;for(const c of x)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function missions(){const wk=weekKey(); if(!D.week||D.week.key!==wk) D.week={key:wk,prog:{},claimed:[],bonusClaimed:false};
  const k=D.kelas,h=hashStr(wk+'k'+k),isls=allIslands(k),isl=isls[h%isls.length];
  return [
   {id:k+'lv_'+isl,t:`Selesaikan 3 level di ${ISL[isl].name}`,goal:3,ev:'level:'+isl},
   [{id:k+'correct',t:'Jawab benar 40 soal',goal:40,ev:'correct'},{id:k+'stars3',t:'Dapat 3 bintang di 3 level',goal:3,ev:'stars3'}][h%2],

function weekReward(){ if(!D.week||D.week.key!==weekKey()) missions(); if(D.week.reward===undefined){ const free=EXCL.filter(x=>!D.owned.includes(x)); D.week.reward=free.length?free[hashStr(D.week.key)%free.length]:null; save(); } return D.week.reward;}
function missionEvent(ev){ const ms=missions(); let changed=false; ms.forEach(m=>{ if(m.ev!==ev) return; const p=D.week.prog[m.id]||0; if(p>=m.goal) return; D.week.prog[m.id]=p+1; changed=true;

const LESSONS={0:[['count','Menghitung'],['add','Penjumlahan'],['sub','Pengurangan']],1:[['count','Menghitung'],['add','Penjumlahan'],['sub','Pengurangan'],['place','Puluhan'],['jam','Jam'],['uang','Uang'],['ukur','Mengukur']],
  2:[['place','Nilai Tempat'],['add','Penjumlahan'],['sub','Pengurangan'],['mul','Perkalian'],['div','Pembagian'],['jam','Jam'],['uang','Uang'],['ukur','Mengukur']],
  3:[['place','Nilai Tempat'],['add','Penjumlahan'],['sub','Pengurangan'],['mul','Perkalian'],['div','Pembagian'],['jam','Jam'],['uang','Uang'],['ukur','Mengukur']]};
function newEx(type,k){
  if(k===0){ if(type==='count') return {n:R(3,8)}; if(type==='add'){const a=R(1,5),b=R(1,4);return {a,b};} if(type==='sub'){const a=R(3,8),b=R(1,a-1);return {a,b};} }
  if(type==='count') return {n:R(4,12)};
  if(type==='add'){const a=R(2,k===1?8:9),b=R(1,k===1?Math.min(8,20-a):9);return {a,b};}
  if(type==='sub'){const a=R(5,k===1?12:15),b=R(1,a-2);return {a,b};}
  if(type==='mul'){return {r:R(2,k===2?5:6),c:R(2,k===2?5:7)};}
  if(type==='div'){const d=R(2,4),q=R(2,k===2?4:5);return {d,q,n:d*q};}
  if(type==='place'){return {n:k===1?R(11,19):k===2?R(21,98):R(101,989)};}
  if(type==='jam'){return {h:R(1,12),m:k===1?pick([0,30]):k===2?pick([0,15,30,45]):R(1,11)*5};}
  if(type==='uang'){const dn=DENOM[k];return {items:Array.from({length:3},()=>pick(dn)).sort((a,b)=>b-a)};}
  if(type==='ukur'){return {len:R(3,12)};}
}
function lessonSteps(L){const t=L.type,e=L.ex; if(t==='mul') return e.r+1; if(t==='div') return e.q+2; if(t==='uang') return e.items.length+1; return 3;}
function lessonBody(L){const t=L.type,e=L.ex,s=L.step;let vis='',txt='',eq=''; if(e&&e.o==null) e.o=R(0,OBJS.length-1); OBJ=e.o;
  if(t==='count'){ vis=`<div class="vis"><div class="grp" style="max-width:190px">${apples(e.n,'#E8475C',{num:s>=1})}</div></div>`;
    txt=['Lihat apel-apel ini. Ada berapa ya?','Kita hitung satu per satu. Lihat angka di setiap apel.',`Apel terakhir bernomor ${e.n}. Jadi ada ${e.n} apel!`][s]; eq=s===2?`${e.n} apel`:''; }
  if(t==='add'){ vis=`<div class="vis"><div class="grp">${apples(e.a,'#E8475C',{num:s===2})}</div>${s>=1?`<div class="op">+</div><div class="grp">${apples(e.b,'#3DB83A',{num:s===2,start:e.a})}</div>`:''}</div>`;
    txt=[`Ada ${e.a} apel merah.`,`Lalu datang ${e.b} apel hijau. Kita gabungkan!`,`Hitung semuanya: ada ${e.a+e.b} apel.`][s]; eq=s===2?`${e.a} + ${e.b} = ${e.a+e.b}`:s===1?`${e.a} + ${e.b} = ?`:''; }
  if(t==='sub'){ vis=`<div class="vis"><div class="grp" style="max-width:220px">${apples(e.a,'#E8475C',{gone:s>=1?e.b:0,num:s===2,numKeep:true})}</div></div>`;
    txt=[`Ada ${e.a} apel.`,`Kiki memakan ${e.b} apel. Apel yang dimakan kita coret.`,`Hitung apel yang tersisa: ${e.a-e.b} apel.`][s]; eq=s===2?`${e.a} − ${e.b} = ${e.a-e.b}`:s===1?`${e.a} − ${e.b} = ?`:''; }
  if(t==='mul'){ const lit=Math.min(s,e.r); let cells='';for(let i=0;i<e.r;i++)for(let j=0;j<e.c;j++)cells+=`<i class="${i<lit?'':'off'}"></i>`;
    vis=`<div class="vis"><div class="arr" style="grid-template-columns:repeat(${e.c},20px)">${cells}</div></div>`;
    const sums=Array(lit).fill(e.c).join(' + ');
    txt=s===0?`${e.r} × ${e.c} artinya ada ${e.r} baris, setiap baris berisi ${e.c}.`:s<e.r?`Baris ke-${s}: ${sums} = ${e.c*s}`:`Semua ${e.r} baris: ${sums} = ${e.r*e.c}. Perkalian adalah penjumlahan berulang!`;
    eq=s>=e.r?`${e.r} × ${e.c} = ${e.r*e.c}`:`${e.r} × ${e.c} = ?`; }
  if(t==='div'){ const round=Math.min(Math.max(s-1,0),e.q); const left=e.n-round*e.d; let pl='';for(let i=0;i<e.d;i++)pl+=`<div class="plate">${'<i></i>'.repeat(round)}</div>`;
    vis=`<div class="vis" style="flex-direction:column;gap:10px"><div class="grp" style="max-width:220px;min-height:20px">${'<i style="width:16px;height:16px;border-radius:999px;background:#FF8A3D;display:block"></i>'.repeat(left)}</div><div class="plates">${pl}</div></div>`;
    txt=s===0?`Ada ${e.n} kue yang mau dibagi rata ke ${e.d} piring.`:s<=e.q?`Bagikan satu-satu ke setiap piring. Putaran ke-${round}.`:`Kue habis! Setiap piring dapat ${e.q} kue.`;
    eq=s>e.q?`${e.n} : ${e.d} = ${e.q}`:`${e.n} : ${e.d} = ?`; }
  if(t==='place'){ const h=Math.floor(e.n/100),tt=Math.floor(e.n/10)%10,o=e.n%10;
    vis=s>=1?placeHTML(e.n):`<div style="font-size:64px;font-weight:800">${fmt(e.n)}</div>`;
    txt=[`Kita bongkar angka ${fmt(e.n)}.`,`Batang biru = 10 (puluhan), kotak hijau kecil = 1 (satuan)${h?', kotak merah besar = 100 (ratusan)':''}.`,`${fmt(e.n)} = ${h?h+' ratusan + ':''}${tt} puluhan + ${o} satuan`][s];
    eq=s===2?`${fmt(e.n)} = ${h?fmt(h*100)+' + ':''}${tt*10} + ${o}`:''; }
  if(t==='jam'){ vis=`<div class="vis">${clockSVG(e.h,e.m,'min(160px,20dvh)')}</div>`;
    txt=[`Jarum pendek berwarna merah menunjuk JAM. Sekarang jarum pendek dekat angka ${e.h}.`,e.m===0?'Jarum panjang berwarna biru menunjuk MENIT. Jarum panjang di angka 12 artinya tepat, 00 menit.':`Jarum panjang berwarna biru menunjuk MENIT. Setiap angka = 5 menit, jadi jarum panjang di angka ${e.m/5} artinya ${e.m} menit.`,`Jadi sekarang jam ${tStr(e.h,e.m)}.`][s];
    eq=s===2?tStr(e.h,e.m):''; }
  if(t==='uang'){ const shown=s===0?e.items:e.items; let run=0; const parts=e.items.slice(0,s).map(v=>rp(run+=v));
    vis=moneyHTML(shown);
    txt=s===0?'Ayo hitung uang ini. Mulai dari uang yang paling besar.':s<e.items.length?`Tambahkan ${rp(e.items[s-1])}. Sekarang jumlahnya ${parts[parts.length-1]}.`:`Semuanya dijumlahkan: ${rp(e.items.reduce((a,b)=>a+b,0))}.`;
    eq=s>=e.items.length?`${e.items.map(rp).join(' + ')} = ${rp(e.items.reduce((a,b)=>a+b,0))}`:(parts.length?parts.join(' → '):''); }
  if(t==='ukur'){ vis=`<div class="vis">${rulerSVG({mode:'cm',start:0,len:e.len},s>=1)}</div>`;
    txt=['Untuk mengukur, letakkan ujung kiri benda tepat di angka 0 penggaris.',`Lalu lihat angka di bawah ujung kanan benda: angka ${e.len}.`,`Jadi panjang pensil ini ${e.len} cm (sentimeter).`][s]; eq=s===2?`${e.len} cm`:''; }
  return {vis,txt:objTxt(txt,e.o),eq:objTxt(eq,e.o)};}

const TARGET={0:8,1:10,2:12,3:15}; const DURK={0:120,1:90,2:75,3:60};
VIEWS.challenge=()=>{const k=D.kelas; const ms=missions(); const W=D.week; const rew=weekReward(); const allDone=ms.every(m=>W.claimed.includes(m.id));
  const rewLook=Object.assign({},D.look); if(rew){const [kk,key]=rew.split(':'); if(kk==='c')rewLook.color=key; if(kk==='g')rewLook.glasses=key; if(kk==='h')rewLook.hat=key; if(kk==='d')rewLook.dress=key;}
  const rows=ms.map(m=>{const p=Math.min(W.prog[m.id]||0,m.goal),done=p>=m.goal,cl=W.claimed.includes(m.id);
    return `<div class="mission"><div style="flex:1;min-width:0"><div class="m-t">${esc(m.t)}</div><div class="m-bar"><div style="width:${p/m.goal*100}%"></div></div><div class="m-p">${p}/${m.goal}</div></div>
      ${cl?`<span class="m-done">${svgI.check}</span>`:done?`<button class="m-claim" data-act="claimMission" data-arg="${m.id}">Ambil +3 ${starIco(18,true)}</button>`:`<span class="m-rew">+3 ${starIco(20,true)}</span>`}</div>`;}).join('');
  return `<div class="screen" style="background:#FFE4F1">${topBar('#F2A0C8')}
   <div class="card" style="--sh:#F2A0AB;margin:2px 14px 0">
     <div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-size:24px;font-weight:800">Misi Minggu Ini</div><div class="muted" style="font-size:16px;font-weight:700">Misi baru setiap hari Senin</div></div>
     <div class="center" style="flex-shrink:0">${rew?kiko(64,'happy',rewLook):starIco(48,true)}<div style="font-size:14px;font-weight:800;line-height:1.1;max-width:90px">${rew?esc(itemOf(rew).n):'+10 bintang'}</div></div></div>
     <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${rows}</div>
     ${allDone&&!W.bonusClaimed?`<button class="btn btn-orange" style="margin-top:10px;height:48px;min-height:48px;font-size:18px" data-act="claimWeek">Ambil hadiah spesial!</button>`:W.bonusClaimed?`<div class="muted center" style="font-weight:700;margin-top:8px">Hadiah spesial minggu ini sudah diambil.</div>`:`<div class="muted center" style="font-size:16px;font-weight:700;margin-top:10px;line-height:1.3">Selesaikan ketiga misi untuk hadiah spesial yang tidak bisa dibeli!</div>`}
   </div>
   <div class="card" style="--sh:#F2A0AB;margin:12px 14px 12px;display:flex;flex-direction:column;gap:8px">
     <div style="display:flex;align-items:center;gap:10px"><div style="color:#FF5FA2;flex-shrink:0">${ico('boat',60)}</div>
     <div style="flex:1;min-width:0"><div style="font-size:24px;font-weight:800">Balap Unicorn</div><div class="muted" style="font-size:16px;font-weight:700;line-height:1.3">${TARGET[k]} soal sebelum Unicorn Pelangi sampai (${DURK[k]} dtk) · Rekor ${D.best[k]||0}</div></div></div>
     <button class="btn btn-green" data-act="chStart">${svgI.play} Mulai Balapan</button></div>
   ${nav('challenge')}</div>`;};

  const opts=q.opts.map((v,i)=>`<button class="opt${c.flash&&c.flash.i===i?(c.flash.ok?' ok':' bad'):(!c.flash&&c.sel===i?' sel':'')}" data-act="chPick" data-arg="${i}" aria-pressed="${c.sel===i}" style="${String(fmt(v)).length>4?'font-size:28px':''}">${fmt(v)}</button>`).join('');

   <div class="race" style="margin-top:4px;flex-shrink:0"><div class="lane"><span class="who">KAMU ${c.score}/${tg}</span><span class="boat" id="meBoat" style="left:${4+c.score/tg*78}%;color:#FF5FA2">${ico('boat',40)}</span><span class="flag">🏁</span></div>
   <div class="lane"><span class="who">PELANGI</span><span class="boat" id="roboBoat" style="left:${4+Math.min(1,(dur-c.left)/dur)*78}%;color:#A985E6">${ico('boat',40)}</span><span class="flag">🏁</span></div></div>
   <div class="qcard"><div class="expr${q.expr.length>14?' small':''}">${esc(q.expr).replace('?','<span class="blank">?</span>')}</div></div>

   <div style="padding:12px 14px calc(14px + env(safe-area-inset-bottom));flex-shrink:0"><button class="btn btn-green" style="height:56px" data-act="chAns" ${c.sel==null||c.flash?'disabled':''}>${c.sel==null?'Pilih jawabanmu':'Jawab: '+fmt(q.opts[c.sel])}</button></div></div>`;};
VIEWS.chEnd=()=>{const c=S.ch,k=D.kelas;

  return `<button class="shop-item${on?' on':''}${it.ex&&!own?' ex':''}" data-act="shop" data-arg="${id}" aria-label="${it.n}${on?', dipakai':own?', milikmu':it.ex?', hadiah misi':', harga '+it.p+' bintang'}">${kiko(52,'normal',look)}<span class="nm">${it.n}</span><span class="pr">${on?'Dipakai':own?'Milikmu':it.ex?'Hadiah misi':`${starIco(13,true)} ${it.p}`}</span></button>`;}

function startLevel(isl,lv){const q=genQ(D.kelas,isl,lv);S.isl=isl;S.game={isl,lv,idx:0,correct:0,wrong:0,lives:3,picked:null,sel:null,hint:0,retry:[],q,work:initWork(q),seen:new Set()};go('play');
  autoSpeak((lv===8?`Kalahkan ${(BOSS[isl]||BOSS.angka)[0]}! Jawab 10 soal dengan benar. `:'')+qSpeech(q));}
function nextQ(){const g=S.game; g.idx++; g.picked=null; g.sel=null; g.hint=0; g.comfort=''; g.ok=false;
  let q; const remaining=10-g.correct;
  if(g.retry.length&&remaining<=g.retry.length+1&&g.idx-g.retry[0].at>1){ const r=g.retry.shift(); q=Object.assign({},r.q,{opts:shuffle(r.q.opts),retry:true}); if(q.nums) q.nums=shuffle(q.nums); }
  else { let tries=0; do{q=genQ(D.kelas,g.isl,g.lv);tries++;}while(g.seen.has(q.expr+q.text)&&tries<8); }
  g.seen.add(q.expr+q.text); g.q=q; g.work=initWork(q); render(); autoSpeak((q.retry?'Ayo coba lagi soal tadi. ':'')+qSpeech(q));}
function finishLevel(win){const g=S.game,k=D.kelas,p=prog(k,g.isl);D.played++;
  const stars=win?(g.wrong===0?3:g.wrong===1?2:1):0; let gain=0,sticker=null,unlockedIsland=null;
  if(win){ const wasDone=p[g.lv-1]>0; const before=p[g.lv-1]; if(stars>before){gain=stars-before;p[g.lv-1]=stars;}
    missionEvent('level:'+g.isl); if(stars===3) missionEvent('stars3');
    if(!wasDone){ sticker=freeSticker(); if(sticker!=null) D.stickers.push(sticker); if(g.lv===8) D.certDate[k+':'+g.isl]=today();
      if(g.lv===8){const reg=REGION2.includes(g.isl)?'pintar':'hitung'; const ids=regionIslands(k,reg),i=ids.indexOf(g.isl); if(i<ids.length-1&&!D.openAll) unlockedIsland=ids[i+1];}}
  }
  save(); const BN=(BOSS[g.isl]||BOSS.angka)[0]; S.result={win,stars,gain,sticker,correct:g.correct,wrong:g.wrong,lv:g.lv,isl:g.isl,unlockedIsland,cert:win&&g.lv===8,title:win?(g.lv===8?BN+' kalah!':pick(['Hebat sekali!','Luar biasa!','Kamu juara!'])):(g.lv===8?'Penjaga masih kuat!':'Ayo coba lagi!')}; S.stickerOpen=false; S.newSticker=sticker;
  go('result'); if(win){SFX.win();confetti();timers.push(setTimeout(()=>SFX.star(),700));if(unlockedIsland)timers.push(setTimeout(()=>SFX.unlock(),1300));}else SFX.lose();
  announce(win?`Level selesai dengan ${stars} bintang`:'Nyawa habis, coba lagi');
  timers.push(setTimeout(()=>autoSpeak(win?`Hebat sekali! Kamu dapat ${stars} bintang.`+(sticker!=null?(g.lv===8?' Ketuk peti harta karun!':' Ada stiker baru untukmu!'):''):'Nyawamu habis. Tidak apa-apa, ayo coba lagi!'),900));}
function confetti(){const cols=['#E8475C','#2E9BE6','#3DB83A','#FFC21A','#FF8A3D','#B07BFF'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=pick(cols);d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}}
function chStart(){const k=D.kelas,dur=DURK[k];S.ch={sel:null,score:0,wrong:0,left:dur,q:genChallenge(k),flash:null,t0:Date.now(),done:false};go('chPlay'); autoSpeak(S.ch.q.expr.replace('?','berapa'));
  const iv=setInterval(()=>{const c=S.ch; if(!c||c.done||S.screen!=='chPlay'){clearInterval(iv);return;}
    c.left=Math.max(0,dur-(Date.now()-c.t0)/1000);
    const t=document.getElementById('chTime'), rb=document.getElementById('roboBoat');
    if(t){const s=Math.ceil(c.left); if(t.textContent!==s+' dtk'){t.textContent=s+' dtk'; if(s<=10) SFX.tick();} t.style.color=c.left<=10?'#B42D3F':'';}
    if(rb) rb.style.left=(4+Math.min(1,(dur-c.left)/dur)*78)+'%';
    if(c.left<=0) chEnd(false);
  },200); timers.push(iv);}
function chEnd(win){const c=S.ch,k=D.kelas; if(c.done) return; c.done=true; c.win=win; if(win) missionEvent('race'); c.newBest=c.score>(D.best[k]||0); if(c.newBest) D.best[k]=c.score; save(); go('chEnd'); if(win){SFX.win();confetti();}else SFX.lose(); autoSpeak(win?'Kamu menang! Hebat!':'Unicorn Pelangi sampai duluan. Ayo coba lagi!');}

function decodeBackup(code){code=String(code||'').trim().replace(/\s+/g,''); if(!code.startsWith('PH1-')) throw new Error('bad'); const obj=JSON.parse(decodeURIComponent(escape(atob(code.slice(4))))); if(!obj||typeof obj!=='object'||!obj.prog) throw new Error('bad'); return obj;}

  mAdd(v){const g=S.game; if(!g||g.picked!=null||g.q.kind!=='money') return; if(g.work.items.length>=12){toast('Dompet sudah penuh');return;} g.work.items.push(+v); g.work.items.sort((a,b)=>b-a); SFX.drop(); render();},
  mRemove(i){const g=S.game; if(!g||g.picked!=null) return; g.work.items.splice(+i,1); SFX.tap(); render();},
  cAdj(a){const g=S.game; if(!g||g.picked!=null) return; const w=g.work,st=g.q.step;
    if(a==='h+1') w.h=w.h%12+1; else if(a==='h-1') w.h=w.h===1?12:w.h-1;
    else if(a==='m+'){ w.m+=st; if(w.m>=60){w.m-=60;w.h=w.h%12+1;} } else if(a==='m-'){ w.m-=st; if(w.m<0){w.m+=60;w.h=w.h===1?12:w.h-1;} }
    SFX.tick(); render();},
  oAdd(i,el,zone){const g=S.game; if(!g||g.picked!=null) return; const w=g.work; i=+i; if(w.placed.includes(i)) return;
    let si=zone&&zone.dataset.slot!=null?+zone.dataset.slot:-1; if(si<0||w.placed[si]!=null) si=w.placed.indexOf(null); if(si<0) return; w.placed[si]=i; SFX.drop(); render();},
  viewStk(i){ i=+i; const own=STICKERS.map((_,j)=>j).filter(j=>D.stickers.includes(j)).sort((a,b)=>a-b); const pos=own.indexOf(i); if(pos<0) return; SFX.tap();
    const pg=ALBUM[Math.floor(i/10)].n, prev=own[(pos-1+own.length)%own.length], next=own[(pos+1)%own.length];
    modal(`<div class="stk-big" aria-hidden="true">${STICKERS[i]}</div><div style="font-size:28px;font-weight:800;margin-top:6px">${esc(STK_NAMES[i])}</div><div class="muted" style="font-size:16px;font-weight:700">${esc(pg)} · stiker ${pos+1} dari ${own.length}</div>
      <div style="display:flex;gap:10px;margin-top:16px">${own.length>1?`<button class="btn btn-white" style="flex:1;font-size:34px" data-act="viewStk" data-arg="${prev}" aria-label="Stiker sebelumnya">‹</button>`:''}<button class="btn btn-green" style="flex:2" data-act="closeModal">Tutup</button>${own.length>1?`<button class="btn btn-white" style="flex:1;font-size:34px" data-act="viewStk" data-arg="${next}" aria-label="Stiker berikutnya">›</button>`:''}</div>`,'Stiker '+STK_NAMES[i]);
    autoSpeak(STK_NAMES[i]); },
  lockedStk(){ SFX.tap(); toast('Belum didapat. Selesaikan level untuk dapat stiker baru!'); },
  tClear(){const g=S.game; if(!g||g.picked!=null||!g.work) return; g.work.strokes=[]; g.work.cov=0; g.work.out=0; SFX.tap(); render();},
  oRemove(si){const g=S.game; if(!g||g.picked!=null) return; if(g.work.placed[+si]==null) return; g.work.placed[+si]=null; SFX.tap(); render();},
  claimMission(id){const W=D.week; if(!W||W.claimed.includes(id)) return; const m=missions().find(x=>x.id===id); if(!m||(W.prog[id]||0)<m.goal) return; W.claimed.push(id); D.bonus=(D.bonus||0)+3; save(); SFX.coin(); render(); toast('+3 bintang untuk Lemari Kiki!');},
  claimWeek(){const W=D.week; if(!W||W.bonusClaimed) return; const rew=weekReward(); W.bonusClaimed=true;
    if(rew){ D.owned.push(rew); const [kk,key]=rew.split(':'); if(kk==='c')D.look.color=key; if(kk==='g')D.look.glasses=key; if(kk==='h')D.look.hat=key; if(kk==='d')D.look.dress=key; }
    else D.bonus=(D.bonus||0)+10;
    save(); SFX.chest(); confetti(); render();
    modal(`${kiko(110,'happy',null,'k-dance')}<div style="font-size:22px;font-weight:800;margin-top:6px">${rew?esc(itemOf(rew).n)+' untuk Kiki!':'+10 bintang!'}</div><div class="muted" style="font-weight:600;margin:4px 0 14px">${rew?'Hadiah spesial ini hanya bisa didapat dari misi. Kiki sudah memakainya!':'Semua hadiah spesial sudah kamu miliki.'}</div><button class="btn btn-green" data-act="closeModal">Hore!</button>`,'Hadiah misi');
    autoSpeak(rew?'Hore! Kiki dapat '+itemOf(rew).n+'!':'Hore! Kamu dapat sepuluh bintang!');},
  claimAlbum(ai){ai=+ai; if(D.albumClaimed.includes(ai)) return; const ids=ALBUM[ai].s.map((_,j)=>ai*10+j); if(!ids.every(i=>D.stickers.includes(i))) return; D.albumClaimed.push(ai); D.bonus=(D.bonus||0)+5; save(); SFX.chest(); confetti(); render(); toast(`Halaman ${ALBUM[ai].n} lengkap! +5 bintang`);},
  cert(arg){const [k,id]=arg.split(':'); SFX.tap(); S.certBack=S.screen; openCert(+k,id);},
  certBack(){go(S.certBack==='result'?'result':'collection');},
  certSave(){ if(!DL||!S.certCanvas) return; S.certCanvas.toBlob(b=>{ if(!b) return; const [k,id]=S.certFor; DL.save({filename:`Sertifikat ${D.name||'Juara'} - ${ISL[id].name} ${kName(k)}.png`,data:b}).then(()=>toast('Sertifikat tersimpan!'),e=>{ if(e&&e.code==='declined') return; toast('Belum bisa mengunduh di sini. Tekan lama gambarnya untuk menyimpan.'); }); },'image/png'); },
  shop(id){const [kind,key]=id.split(':'); const tbl=kind==='c'?COLORS:kind==='g'?GLASSES:kind==='d'?DRESSES:HATS; const it=tbl[key]; if(!it) return;
    if(it.ex&&!D.owned.includes(id)){ SFX.tap(); toast('Hadiah spesial dari Misi Minggu Ini. Lihat menu Tantangan!'); return; }
    const apply=()=>{ if(kind==='c')D.look.color=key; if(kind==='g')D.look.glasses=key; if(kind==='h')D.look.hat=key; if(kind==='d')D.look.dress=key; save(); };
    if(D.owned.includes(id)||it.p===0){ if(!D.owned.includes(id)) D.owned.push(id); apply(); SFX.tap(); render(); return; }
    if(coins()<it.p){ SFX.wrong(); toast(`Bintangmu kurang ${it.p-coins()}. Ayo main lagi!`); return; }
    const look=Object.assign({},D.look); if(kind==='c')look.color=key; if(kind==='g')look.glasses=key; if(kind==='h')look.hat=key; if(kind==='d')look.dress=key;
    S.pendingBuy=id;
    modal(`${kiko(96,'happy',look)}<div style="font-size:21px;font-weight:800;margin-top:4px">Beli ${it.n}?</div><div style="font-weight:700;margin:4px 0 14px;display:flex;justify-content:center;align-items:center;gap:6px">Harga ${starIco(18,true)} ${it.p} · Bintangmu ${coins()}</div><div style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-green" data-act="buy">Beli & pakai</button><button class="btn btn-white" data-act="closeModal">Nanti saja</button></div>`,'Beli barang');},
  buy(){const id=S.pendingBuy; if(!id) return; const [kind,key]=id.split(':'); const tbl=kind==='c'?COLORS:kind==='g'?GLASSES:kind==='d'?DRESSES:HATS; const it=tbl[key]; if(coins()<it.p) return;
    D.spent=(D.spent||0)+it.p; D.owned.push(id); if(kind==='c')D.look.color=key; if(kind==='g')D.look.glasses=key; if(kind==='h')D.look.hat=key; if(kind==='d')D.look.dress=key; save(); S.pendingBuy=null; S.modal=null; SFX.coin(); confetti(); render(); autoSpeak('Wah, Kiki jadi keren!');},
  setK(n){D.kelas=+n;S.sel=null;S.lesson=null;save();SFX.tap();render();},
  repK(n){S.repKelas=+n;SFX.tap();render();},
  openAll(){D.openAll=!D.openAll;save();SFX.tap();render();},
  voice(){D.voice=!D.voice;save();SFX.tap();if(!D.voice)stopSpeak();render();},
  testVoice(){speak('Halo '+(D.name||'Juara')+'! Delapan tambah lima sama dengan tiga belas.');},
  askReport(){const a=R(6,9),b=R(6,9); S.gateAns=a*b; SFX.tap();
    modal(`<div style="font-size:21px;font-weight:800">Khusus orang tua / guru</div><div class="muted" style="font-weight:600;margin:4px 0 10px">Jawab soal ini untuk membuka laporan.</div><form data-form="gate" style="display:flex;flex-direction:column;gap:10px"><label for="gate" style="font-size:26px;font-weight:800">${a} × ${b} = ?</label><input id="gate" class="txt" inputmode="numeric" autocomplete="off" autofocus style="text-align:center"><button class="btn btn-green" type="submit">Buka laporan</button><button class="btn btn-white" type="button" data-act="closeModal">Batal</button></form>`,'Kunci orang tua');},
  backup(){const code=encodeBackup(); const done=()=>toast('Kode sudah disalin. Simpan di tempat aman ya.');
    const show=()=>modal(`<div style="font-size:20px;font-weight:800">Kode cadangan</div><div class="muted" style="font-weight:600;margin:4px 0 8px">Salin seluruh kode ini, lalu simpan (misalnya di catatan HP).</div><textarea class="txt code" readonly onclick="this.select()">${esc(code)}</textarea><button class="btn btn-green" style="margin-top:10px" data-act="closeModal">Selesai</button>`,'Kode cadangan');
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,show); } else show(); }catch(e){ show(); } },
  restoreAsk(){modal(`<div style="font-size:20px;font-weight:800">Masukkan kode cadangan</div><div class="muted" style="font-weight:600;margin:4px 0 8px">Progres di perangkat ini akan diganti dengan isi kode.</div><form data-form="restore" style="display:flex;flex-direction:column;gap:10px"><textarea id="rc" class="txt code" placeholder="PH1-…" autofocus></textarea><button class="btn btn-green" type="submit">Pulihkan progres</button><button class="btn btn-white" type="button" data-act="closeModal">Batal</button></form>`,'Pulihkan progres');},
  askReset(){modal(`<div style="font-size:22px;font-weight:800">Hapus semua progres?</div><div class="muted" style="font-weight:600;margin:4px 0 16px">Bintang, stiker, baju Kiki, dan rekor di semua kelas akan hilang.</div><div style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-white" data-act="closeModal">Batal</button><button class="btn" style="background:#E8475C;color:#fff;box-shadow:0 6px 0 #B42D3F" data-act="doReset">Ya, hapus</button></div>`,'Hapus progres');},
  doReset(){const name=D.name,k=D.kelas,snd=D.sound,v=D.voice,mu=D.music;D=blank();D.name=name;D.kelas=k;D.sound=snd;D.voice=v;D.music=mu;save();S.modal=null;S.sel=null;go('map');}
};
let DRAG=null,CLK=null,suppressClick=false;
function dropAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-drop]');}
app.addEventListener('pointerdown',e=>{
  const ck=e.target.closest('#dragClock'); if(ck&&!ck.classList.contains('locked')){ CLK={el:ck}; try{ck.setPointerCapture(e.pointerId);}catch(_){} clockMove(e); e.preventDefault(); return; }
  const el=e.target.closest('[data-drag]'); if(!el||el.disabled) return; DRAG={el,x:e.clientX,y:e.clientY,moved:false,ghost:null};});
function clockMove(e){const g=S.game; if(!CLK||!g||!g.work) return; const r=CLK.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; let a=Math.atan2(e.clientX-cx,-(e.clientY-cy))*180/Math.PI; if(a<0)a+=360;
  const st=g.q.step; let m=Math.round(a/6/st)*st%60; const w=g.work, pm=w.m; if(m===pm) return; if(pm>=45&&m<15) w.h=w.h%12+1; else if(pm<15&&m>=45) w.h=w.h===1?12:w.h-1; w.m=m; updateClockHands(w); SFX.tick();}
window.addEventListener('pointermove',e=>{
  if(CLK){ clockMove(e); e.preventDefault(); return; }
  if(!DRAG) return; const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.moved&&Math.hypot(dx,dy)>8){ DRAG.moved=true; const r=DRAG.el.getBoundingClientRect(); const gh=DRAG.el.cloneNode(true); gh.classList.add('ghost'); gh.removeAttribute('data-act'); gh.style.position='fixed'; gh.style.left=r.left+'px'; gh.style.top=r.top+'px'; gh.style.width=r.width+'px'; gh.style.height=r.height+'px'; gh.style.margin='0'; gh.style.pointerEvents='none'; gh.style.zIndex='500'; document.body.appendChild(gh); DRAG.ghost=gh; }
  if(DRAG.moved){ e.preventDefault(); DRAG.ghost.style.transform=`translate(${dx}px,${dy}px) scale(1.1) rotate(-4deg)`; document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over')); const z=dropAt(e.clientX,e.clientY); if(z) z.classList.add('over'); } },{passive:false});
window.addEventListener('pointerup',e=>{
  if(CLK){ CLK=null; render(); return; }
  if(!DRAG) return; const d=DRAG; DRAG=null; if(!d.moved) return; if(d.ghost) d.ghost.remove(); document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over'));
  suppressClick=true; setTimeout(()=>suppressClick=false,80); const z=dropAt(e.clientX,e.clientY); if(z){ const f=A[d.el.dataset.act]; if(f) f(d.el.dataset.arg,d.el,z); } });
window.addEventListener('pointercancel',()=>{ if(DRAG&&DRAG.ghost) DRAG.ghost.remove(); DRAG=null; if(CLK){CLK=null;render();} });
app.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); } });
app.addEventListener('click',e=>{ musicStart(); if(suppressClick) return; const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=A[el.dataset.act]; if(f){e.preventDefault(); f(el.dataset.arg,el);} });
app.addEventListener('submit',e=>{e.preventDefault(); const f=e.target.dataset.form;
  if(f==='welcome'){const nm=(document.getElementById('nm').value||'').trim(); D.name=nm||'Juara'; D.kelas=S.tmpK!=null?S.tmpK:(D.kelas!=null?D.kelas:1); save(); SFX.win(); S.sel=null; go('map'); musicStart();}
  if(f==='gate'){const v=parseInt((document.getElementById('gate').value||'').trim(),10); if(v===S.gateAns){S.modal=null;S.repKelas=D.kelas;go('report');} else {SFX.wrong();toast('Jawaban belum tepat.');}}
  if(f==='restore'){try{const obj=decodeBackup(document.getElementById('rc').value); D=loadFrom(obj); save(); S.modal=null; S.sel=null; SFX.win(); toast('Progres berhasil dipulihkan!'); go('map');}catch(err){SFX.wrong();toast('Kode tidak valid. Periksa lagi ya.');}}
});
app.addEventListener('input',e=>{if(e.target.dataset.input==='name'){D.name=e.target.value.trim()||'Juara';save();}});
if(webVoice) try{speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
render();
window.__PH={moneyDragQ,clockDragQ,orderDragQ,workCorrect,initWork,missions,ALBUM,drawCert,genQ,genChallenge,KELAS,REGION2,newEx,lessonSteps,lessonBody,decodeBackup,encodeBackup};
})();
